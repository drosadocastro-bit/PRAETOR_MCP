name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.x', '24.x']
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run check
      - name: Build
        run: npm run build
      - name: Runtime tests and MCP/HTTP smoke
        run: npm test -- --run
      - name: MCP stdio smoke
        run: npm test -- --run test/mcp-smoke.test.ts
      - name: HTTP health/auth smoke
        run: npm test -- --run test/http-server.test.ts
      - name: Historical G2 and runtime baseline verification
        run: npm run test:historical
      - name: Post-G3B durability tests
        run: npm run test:durability
      - name: Hybrid shadow tests
        run: npm run test:hybrid-shadow
      - name: Dependency audit
        run: npm audit --audit-level=moderate
      - name: Whitespace safety
        run: git diff --check

  container:
    name: Container scaffolding smoke
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag praetor-mcp:ci .
      - name: Start HTTP container
        run: |
          docker run --detach --name praetor-mcp-ci \
            --publish 3000:3000 \
            --env PRAETOR_HTTP_KEY=ci-local-application-key-123456 \
            --env PRAETOR_HTTP_ALLOWED_HOSTS=127.0.0.1,localhost \
            --env PRAETOR_HTTP_ALLOWED_ORIGINS=127.0.0.1,localhost \
            praetor-mcp:ci
      - name: Health and auth smoke
        run: |
          for attempt in {1..30}; do curl --fail --silent http://127.0.0.1:3000/healthz && break || sleep 1; done
          curl --fail --silent --show-error -X POST http://127.0.0.1:3000/mcp \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -H 'x-praetor-key: ci-local-application-key-123456' \
            --data '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST http://127.0.0.1:3000/mcp -H 'x-praetor-key: wrong-key' --data '{}')" = 401
      - name: Graceful container shutdown
        if: always()
        run: docker stop --time 5 praetor-mcp-ci
