services:
  praetor-http:
    build: .
    ports:
      - "3000:3000"
    environment:
      PRAETOR_HTTP_KEY: ${PRAETOR_HTTP_KEY:?Set PRAETOR_HTTP_KEY to a 16-512 character application credential}
      PRAETOR_HTTP_ALLOWED_HOSTS: ${PRAETOR_HTTP_ALLOWED_HOSTS:-127.0.0.1,localhost}
      PRAETOR_HTTP_ALLOWED_ORIGINS: ${PRAETOR_HTTP_ALLOWED_ORIGINS:-127.0.0.1,localhost}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
